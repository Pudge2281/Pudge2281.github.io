<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GREEN API Test</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
}

.wrapper {
    width: 900px;
    margin: 40px auto;
    display: flex;
    background: #fff;
    border-radius: 6px;
    padding: 20px;
}

.left {
    width: 40%;
}

.right {
    width: 60%;
    margin-left: 20px;
}

input, textarea, button {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    font-size: 14px;
}

textarea {
    height: 420px;
    resize: none;
}

button {
    background: #2ecc71;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background: #27ae60;
}

label {
    font-size: 13px;
    color: #333;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="left">
    <label>ID Instance</label>
    <input id="idInstance">

    <label>ApiTokenInstance</label>
    <input id="apiToken">

    <button onclick="getSettings()">getSettings</button>
    <button onclick="getStateInstance()">getStateInstance</button>

    <label>Телефон (77771234567)</label>
    <input id="phone">

    <label>Сообщение</label>
    <input id="message" value="Hello world">

    <button onclick="sendMessage()">sendMessage</button>

    <label>URL файла</label>
    <input id="fileUrl">

    <button onclick="sendFileByUrl()">sendFileByUrl</button>
</div>

<div class="right">
    <label>Ответ API</label>
    <textarea id="response" readonly></textarea>
</div>

</div>

<script>
function baseUrl() {
    return `https://api.green-api.com/waInstance${idInstance.value}`;
}

async function callApi(method, url, body = null) {
    try {
        const options = {
            method,
            headers: { "Content-Type": "application/json" }
        };
        if (body) options.body = JSON.stringify(body);

        const res = await fetch(url, options);
        const data = await res.json();

        response.value = JSON.stringify(data, null, 2);
    } catch (e) {
        response.value = "Ошибка запроса: " + e;
    }
}

function getSettings() {
    callApi(
        "GET",
        `${baseUrl()}/getSettings/${apiToken.value}`
    );
}

function getStateInstance() {
    callApi(
        "GET",
        `${baseUrl()}/getStateInstance/${apiToken.value}`
    );
}

function sendMessage() {
    callApi(
        "POST",
        `${baseUrl()}/sendMessage/${apiToken.value}`,
        {
            chatId: phone.value + "@c.us",
            message: message.value
        }
    );
}

function sendFileByUrl() {
    callApi(
        "POST",
        `${baseUrl()}/sendFileByUrl/${apiToken.value}`,
        {
            chatId: phone.value + "@c.us",
            urlFile: fileUrl.value,
            fileName: "file"
        }
    );
}
</script>

</body>
</html>


</body>
</html>
