<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GREEN API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            display: flex;
            width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
        }
        .left {
            width: 45%;
        }
        .right {
            width: 55%;
            margin-left: 20px;
        }
        input, textarea, button {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }
        textarea {
            height: 400px;
            resize: none;
        }
        button {
            cursor: pointer;
        }
        label {
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left">
        <label>ID Instance</label>
        <input id="idInstance" placeholder="idInstance">

        <label>Api Token Instance</label>
        <input id="apiToken" placeholder="ApiTokenInstance">

        <button onclick="getSettings()">getSettings</button>
        <button onclick="getStateInstance()">getStateInstance</button>

        <label>Номер телефона (77771234567)</label>
        <input id="phone" placeholder="77771234567">

        <label>Сообщение</label>
        <input id="message" placeholder="Hello world">

        <button onclick="sendMessage()">sendMessage</button>

        <label>URL файла</label>
        <input id="fileUrl" placeholder="https://site.com/file.jpg">

        <button onclick="sendFileByUrl()">sendFileByUrl</button>
    </div>

    <div class="right">
        <label>Ответ API</label>
        <textarea id="response" readonly></textarea>
    </div>
</div>

<script>
    function getBaseUrl() {
        const id = document.getElementById("idInstance").value;
        const token = document.getElementById("apiToken").value;
        return `https://api.green-api.com/waInstance${id}`;
    }

    async function request(method, url, body = null) {
        const options = {
            method: method,
            headers: { "Content-Type": "application/json" }
        };
        if (body) options.body = JSON.stringify(body);

        const res = await fetch(url, options);
        const data = await res.json();
        document.getElementById("response").value = JSON.stringify(data, null, 2);
    }

    function getSettings() {
        const token = apiToken.value;
        request("GET", `${getBaseUrl()}/getSettings/${token}`);
    }

    function getStateInstance() {
        const token = apiToken.value;
        request("GET", `${getBaseUrl()}/getStateInstance/${token}`);
    }

    function sendMessage() {
        const token = apiToken.value;
        request("POST", `${getBaseUrl()}/sendMessage/${token}`, {
            chatId: phone.value + "@c.us",
            message: message.value
        });
    }

    function sendFileByUrl() {
        const token = apiToken.value;
        request("POST", `${getBaseUrl()}/sendFileByUrl/${token}`, {
            chatId: phone.value + "@c.us",
            urlFile: fileUrl.value,
            fileName: "file"
        });
    }
</script>

</body>
</html>
